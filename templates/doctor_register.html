<!DOCTYPE html>
<html>
<head>
    <title>Doctor Registration</title>
</head>
<body>

<h2>Doctor Registration</h2>

<form method="POST">

    <input type="text" name="name"
           placeholder="Doctor Name" required><br><br>

    <input type="text" name="username"
           placeholder="Username" required><br><br>

    <input type="password" name="password"
           placeholder="Password" required><br><br>

    <input type="email" name="email"
           placeholder="Email" required><br><br>

    <input type="text" name="phone"
           placeholder="Phone" required><br><br>

    <input type="text" name="specialization"
           placeholder="Specialization" required><br><br>

    <input type="text" name="qualification"
           placeholder="Qualification" required><br><br>

    <input type="text" name="hospital_name"
           placeholder="Hospital Name" required><br><br>

    <button type="submit">
        Register Doctor
    </button>

</form>

</body>
</html>
